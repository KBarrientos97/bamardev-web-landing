# CI/CD de la landing: push a dev → QA (qa.bamardev-landing.pages.dev, contra
# api-qa), push a main → PROD (bamardev.com). Mismo flujo que el panel.
#
# Requiere el secret CLOUDFLARE_API_TOKEN (token "Cloudflare Pages: Edit" de la
# cuenta de Kevin — el mismo tipo que usa bamardev-web-licencia). El account id
# no es secreto y wrangler lo lee del .env del repo.
name: Deploy landing

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (main → prod, dev → qa)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npm run build
          else
            npm run build:qa
          fi

      - name: Deploy a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler pages deploy dist --branch=main
          else
            npx wrangler pages deploy dist --branch=qa
          fi
