<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BamarDev — Software de gestión para restaurantes, farmacias y ferreterías</title>
    <meta
      name="description"
      content="Punto de venta, inventario, delivery y control de costos para tu negocio. Funciona sin internet, con respaldo en la nube. Planes desde Bs 75/mes."
    />
    <meta property="og:title" content="BamarDev — El sistema que hace crecer tu negocio" />
    <meta
      property="og:description"
      content="Punto de venta, inventario, delivery y control de costos. Funciona sin internet. Planes desde Bs 75/mes."
    />
    <!-- El "desde Bs 75" es el precio del Emprendedor y está escrito a mano: las
         vistas previas y los buscadores leen este HTML sin JavaScript, así que
         no puede salir del API como el resto de los precios. Si el panel cambia
         el precio del plan más barato, cambiarlo acá también. -->
    <meta property="og:type" content="website" />
    <!-- Absolutas y al dominio de producción a propósito: WhatsApp y Facebook
         arman la vista previa sin JavaScript y no resuelven rutas relativas.
         Sin imagen, el link compartido salía sin miniatura. -->
    <meta property="og:url" content="https://bamardev.com/" />
    <meta property="og:image" content="https://bamardev.com/logo-400.png" />
    <link rel="canonical" href="https://bamardev.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
